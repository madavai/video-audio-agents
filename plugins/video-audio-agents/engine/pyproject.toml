[project]
name = "video-audio-engine"
version = "1.0.0"
description = "The engine behind Video Audio Agents: download, transcribe, subtitle, cut, voice and dub."
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "mcp>=2.3,<3",
    "yt-dlp[default]>=2026.10.21",
    "deno>=2.9",
    "static-ffmpeg>=3.0",
    "faster-whisper>=1.2,<2",
    "playwright>=1.63,<2",
    "chatterbox-tts==0.1.7",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "edge-tts>=7,<8",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "librosa==0.11.0",
    "numpy>=1.24,<2",
    "psutil>=6",
    "demucs==4.1.0",  # takes the voice out of a video's sound, so a dub keeps the music
    "setuptools>=75,<81",  # pkg_resources, without which Chatterbox's watermark (marks speech as AI-made) won't load
]

[project.scripts]
video-audio-engine = "video_audio_engine.server:main"

[dependency-groups]
dev = ["pytest>=8", "jiwer>=3"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# PyTorch 2.6 has no build for Intel Macs, so the engine can't run there; demucs asks for an older PyTorch on them.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

# PyTorch without the multi-GB GPU libraries on Windows and Linux (Macs get the normal build).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
