name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]  # macos-latest is an Apple Silicon Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1  # this action publishes exact version tags only
        with:
          enable-cache: true
          cache-dependency-glob: plugins/video-audio-agents/engine/uv.lock
      - name: Install the engine (locked versions)
        run: uv sync --frozen --project plugins/video-audio-agents/engine
      - name: Keep ffmpeg and the fast speech model between runs
        uses: actions/cache@v6
        with:
          path: .test-data
          key: test-data-${{ runner.os }}-${{ hashFiles('plugins/video-audio-agents/engine/src/video_audio_engine/models.py') }}
      - name: Check the plugin files are valid JSON
        run: uv run --frozen --project plugins/video-audio-agents/engine python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('plugins/video-audio-agents/.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
      - name: Unit and integration tests
        run: uv run --frozen --project plugins/video-audio-agents/engine pytest -v

  mac-ffmpeg-facts:  # TEMPORARY, removed before merge: how the Mac's ffmpeg makes and reads mp3 files
    runs-on: macos-latest
    env:
      VAA_DATA: ${{ runner.temp }}/vaa
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: plugins/video-audio-agents/engine/uv.lock
      - run: uv sync --frozen --project plugins/video-audio-agents/engine
      - name: ffmpeg facts
        shell: bash
        run: |
          uv run --frozen --project plugins/video-audio-agents/engine python - <<'EOF'
          import subprocess
          from video_audio_engine import models
          folder = models.ensure_ffmpeg()
          ff, fp = str(folder / "ffmpeg"), str(folder / "ffprobe")
          def sh(*args):
              r = subprocess.run(args, capture_output=True, text=True)
              return r.stdout + r.stderr
          print([l for l in sh(ff, "-hide_banner", "-version").splitlines() if "version" in l or "configuration" in l])
          print([l for l in sh(ff, "-hide_banner", "-encoders").splitlines() if "mp3" in l.lower()])
          sh(ff, "-y", "-loglevel", "error", "-f", "lavfi", "-i", "sine=frequency=440:duration=10", "-af", "apad=pad_dur=4", "-ar", "16000", "t16.mp3")
          sh(ff, "-y", "-loglevel", "error", "-f", "lavfi", "-i", "sine=frequency=440:duration=10", "-ac", "2", "t44.mp3")
          for f in ("t16.mp3", "t44.mp3"):
              head = open(f, "rb").read(4096)
              print(f, {tag: head.find(tag) for tag in (b"Xing", b"Info", b"LAME", b"Lavc", b"Lavf")})
              print(sh(fp, "-v", "error", "-show_entries", "format=duration:stream=duration,start_time,sample_rate,channels,codec_name", "-of", "csv=p=0", f))
              said = sh(ff, "-hide_banner", "-nostats", "-i", f, "-af", "silencedetect=noise=-45dB:d=0.5,astats=measure_perchannel=none:measure_overall=Number_of_samples", "-f", "null", "-")
              print([l for l in said.splitlines() if "silence_" in l or "Number of samples" in l or "Estimating" in l or "rror" in l])
          EOF
