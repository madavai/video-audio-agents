name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1  # this action publishes exact version tags only
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Install the engine (locked versions)
        run: uv sync --frozen
      - name: Keep ffmpeg and the fast speech model between runs
        uses: actions/cache@v6
        with:
          path: engine/.test-data
          key: test-data-${{ runner.os }}-${{ hashFiles('engine/src/video_audio_engine/models.py') }}
      - name: Check the plugin files are valid JSON
        run: uv run --frozen python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('../.mcp.json', '../.claude-plugin/plugin.json', '../.claude-plugin/marketplace.json')]"
      - name: Unit and integration tests
        run: uv run --frozen pytest -v
